<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>账号注册</title>
    <style>
        body { width: 420px; margin: 50px auto; font-family: "微软雅黑"; }
        .box { border: 1px solid #ddd; padding: 30px; border-radius: 8px; }
        h2 { text-align: center; margin-bottom: 25px; }
        .item { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size:14px; }
        input,textarea { width: 100%; padding: 8px 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        textarea { height: 60px; resize: none; }
        button { width: 100%; padding: 9px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .msg { color: red; text-align: center; margin:10px 0; }
        .login-link { text-align: center; margin-top:15px; }
        .required { color:red; }
    </style>
</head>
<body>
    <div class="box">
        <h2>新用户注册</h2>

        <div class="msg" th:text="${msg}" th:if="${msg}"></div>

        <form th:action="@{/doRegister}" method="post">
            <div class="item">
                <label>用户名 <span class="required">*</span></label>
                <input type="text" name="username" th:value="${username}" required placeholder="至少2个字符">
            </div>

            <div class="item">
                <label>登录密码 <span class="required">*</span></label>
                <input type="password" name="password" required placeholder="至少4个字符">
            </div>

            <div class="item">
                <label>手机号码 <span class="required">*</span></label>
                <input type="text" name="phone" th:value="${phone}" required placeholder="11位手机号">
            </div>

            <div class="item">
                <label>邮箱（选填）</label>
                <input type="email" name="email" th:value="${email}" placeholder="可留空">
            </div>

            <div class="item">
                <label>备注信息（选填）</label>
                <textarea name="remark" placeholder="个人备注，可不填" th:text="${remark}"></textarea>
            </div>

            <button type="submit">完成注册</button>
        </form>

        <div class="login-link">
            已有账号？<a th:href="@{/login}">去登录</a>
        </div>
    </div>
</body>
</html>
